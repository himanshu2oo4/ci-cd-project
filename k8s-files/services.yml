# frontend service
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
spec:
  type: NodePort
  selector:
    app: frontend-app
  ports:
  - port: 80 
    targetPort: 80
    nodePort: 30000


--- 

# service for backend 

apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend-app
  ports:
  - port: 5000
    targetPort: 5000

