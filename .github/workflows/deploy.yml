name: CI CD deployment
on: 
    push: 
        branches: 
            - main 
    workflow_dispatch: 

env: 
    NAMESPACE: "project"
    FRONTEND_SVC: frontend-svc
    BACKEND_SVC: backend-svc 
jobs: 
    build-and-push: 
        runs-on: self-hosted 
        steps: 
            - name: checkout the codes 
              uses: actions/checkout@v6
            
            - name: Gitleaks scan 
              uses: gitleaks/gitleaks-action@v2

            - name: setting up nodejs 
              uses: actions/setup-node@v4
              with:
                node-version: '20' # Specify your version (e.g., 18, 20, 22)


            
            - name: installing dependencies
              run: |
                  cd backend
                  npm install 

            - name: running lint tests 
              run: |
                  cd backend
                  npm run lint 

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
              
            - name: Building frontend image  
              run: docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/frontend:v1 ./backend 

            - name: Building backend image
              run: docker build -t ${{ secrets.DOCKERHUB_USERNAME}}/backend:v1 ./frontend 

            - name: pushing to dockerhub 
              run: | 
                docker push ${{ secrets.DOCKERHUB_USERNAME}}/backend:v1
                docker push ${{ secrets.DOCKERHUB_USERNAME}}/frontend:v1

                echo "----- PUSHED SUCCESSFULLY !!!! "


    Deployment: 
        needs: build-and-push
        runs-on: self-hosted
        steps: 
            - name: checkout code 
              uses: actions/checkout@v4
            
            - name: Test SSH
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                    whoami
                    docker --version
                    kind get clusters
                    kubectl get nodes
            - name: Deploying over k8s 
              run: | 
                cd k8s-files 
                kubectl apply -f namespace.yml 
                kubectl apply -f dep.yml 
                kubectl apply -f services.yml 
                kubectl get pods 
                kubectl get pods -n $NAMESPACE 
                kubectl get svc -n $NAMESPACE 
                kubectl describe svc/$FRONTEND_SVC -n $NAMESPACE 
                kubectl describe svc/$BACKEND_SVC -n $NAMESPACE 
